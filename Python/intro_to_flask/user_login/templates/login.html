<!DOCTYPE html>
<html>
    <head>
        <title>Login</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    </head>
    <body>
        <div class="container mt-5">

            <div align="center" class="bg-light">
                <div class="m-3">
                    <div class="header">
                        <h1 class="word">Login</h1>
                    </div>

                    {% if msg %}
                    <div class="alert alert-info">{{msg}}</div>
                    {% endif %}

                    <form action="/" method="post">

                        <div class="row m-3">
                            <div class="col-4">
                                <label for="username">Username:</label>
                            </div>
                            <div class="col-8">
                                <input type="text" id="username" name="username" class="form-control" placeholder="Enter your name"><br><br>
                            </div>
                        </div>
                        <div class="row m-3">
                            <div class="col-4">
                                <label for="password">Password:</label>
                            </div>
                            <div class="col-8">
                                <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password"><br><br>
                            </div>
                        </div>

                        <input type="submit" value="sign in" class="btn btn-info">
                    </form>

                    <p class="mt-3">Don't have an account? <a href="/register">Register here</a></p>
                </div>
            </div>
        </div>
    </body>
</html>
