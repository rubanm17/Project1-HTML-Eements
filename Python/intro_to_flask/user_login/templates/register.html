<!DOCTYPE html>
<html>
    <head>

        <meta charset="UTF-8">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Registration Form</title>

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    </head>
    <body>
        <div class="container mt-3 bg-light">
            <div align="center" class="">
                <div class="header">
                    
                </div>
                <h2 class="word">
                    <form action="/register" method="post">
                        <div class="msg">{{msg}}</div>
                            <div class="row m-3">
                                <div class="col-4">
                                    <label for="username">Username:</label>
                                </div>
                                <div class="col-8">
                                    <input type="text" id="username" name="username" class="form-control" placeholder="Enter your name"><br><br>
                                </div>
                            </div>
                            <div class="row m-3">
                                <div class="col-4">
                                    <label for="password">Password:</label>
                                </div>
                                <div class="col-8">
                                    <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password"><br><br>
                                </div>
                            </div>
                            <div class="row m-3">
                                <div class="col-4">
                                    <label for="email">Email:</label>
                                </div>
                                <div class="col-8">
                                    <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email"><br><br>
                                </div>
                            </div>
                            <input type="submit" value="Sign Up" class="btn btn-info"><br><br>
                    </form>
                </h2>
                <p class="button">Already have Account? <a href="/login" class="bottom">Sign in here</a></p>
            </div>
        </div>
    </body>
</html>
